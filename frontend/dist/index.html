    <script>
      // Apply theme before React loads to avoid a flash of the wrong theme.
      // Rule: a saved manual choice wins; otherwise respect prefers-color-scheme
      // (defaulting to light).
      (function () {
        try {
          var k = "webvirt-theme";
          var t = localStorage.getItem(k);
          if (t !== "light" && t !== "dark") {
            t = (window.matchMedia &&

              ? "dark" : "light";

          var el = document.documentElement;
          if (t === "dark") el.classList.add("dark");
          el.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
